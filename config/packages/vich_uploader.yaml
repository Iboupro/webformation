vich_uploader:
    db_driver: orm

    mappings:
        course:
            uri_prefix: '/images/formation'
            upload_destination: '%kernel.project_dir%/public/images/formation'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer

        program:
            uri_prefix: '/images/program'
            upload_destination: '%kernel.project_dir%/public/images/program'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer

        users:
            uri_prefix: '/images/users'
            upload_destination: '%kernel.project_dir%/public/images/users'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer

        actualites:
            uri_prefix: '/images/actualites'
            upload_destination: '%kernel.project_dir%/public/images/actualites'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
